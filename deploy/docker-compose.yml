services:
  lapi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 国内服务器在 .env 里设 NPM_REGISTRY=https://registry.npmmirror.com 可显著加快构建
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: lapi:latest
    container_name: lapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内必须监听 0.0.0.0，否则宿主机的端口映射进不来。
      LAPI_BIND: 0.0.0.0
      LAPI_DB: /data/lapi.db
    ports:
      # 只绑到宿主机回环：公网入口交给 Caddy/Nginx 做 TLS，容器端口不直接暴露。
      # 宿主机 8787 被占用时改左边的数字即可（右边的容器内端口保持 8787）。
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
